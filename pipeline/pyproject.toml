[project]
name = "highlighter-pipeline"
version = "0.1.0"
description = "Highlighter core pipeline: capture, transcription, and clip detection."
requires-python = ">=3.11"
dependencies = ["openai", "agent-framework-core>=1.12"]

[project.optional-dependencies]
# TransNetV2 shot-boundary detection (scene cuts + boundary snapping).
shots = ["transnetv2-pytorch", "numpy"]

[tool.setuptools.package-data]
highlighter_pipeline = ["caption_templates/*/*"]

[project.scripts]
highlighter-db-smoke = "highlighter_pipeline.db_smoke:main"
highlighter-ingest = "highlighter_pipeline.ingest:main"
highlighter-reclip = "highlighter_pipeline.reclip:main"
highlighter-revise = "highlighter_pipeline.revise:main"
highlighter-cleanup = "highlighter_pipeline.cleanup:main"
highlighter-publish = "highlighter_pipeline.publish:main"
highlighter-thumbnails = "highlighter_pipeline.thumbnails:main"
highlighter-research = "highlighter_pipeline.research:main"
highlighter-reformat = "highlighter_pipeline.reformat:main"
